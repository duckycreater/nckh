<!doctype html>
<!--
  /offline.html — fallback page shown when the PWA is launched without
  network connectivity. Layer 1.8 (PWA install polish). The page is
  intentionally tiny so the service worker can precache it cheaply.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f8f68" />
    <title>BMO Robot — offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f766e, #064e3b);
        color: #f8fafc;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 28px 32px;
        max-width: 360px;
        text-align: center;
        backdrop-filter: blur(8px);
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; opacity: 0.85; margin: 0 0 16px; }
      button {
        background: #10b981;
        color: white;
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #059669; }
    </style>
  </head>
  <body>
    <main class="card" role="status" aria-live="polite">
      <h1>You're offline</h1>
      <p>
        BMO Robot needs a connection to load new content. Cached scans,
        flashcards, and family challenges remain available.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
