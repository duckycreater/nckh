name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

# One concurrent run per ref; cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, type-check & i18n guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Layer 4.5 — type-check is a blocking gate in the layered overhaul.
      - name: Type-check (tsc --noEmit --strict)
        run: npm run typecheck

      # Layer 4.6 — ESLint must pass; no more `|| true`.
      - name: ESLint v9 flat config
        run: npm run lint

      # Prettier check is a hard gate; formatting regressions block the PR.
      - name: Prettier check
        run: npm run format:check

      - name: Mixed-slash / case-collision guard
        run: npm run check:paths

      - name: Hard-coded secrets guard
        run: npm run check:secrets

      - name: i18n parity + duplicate-key guard
        run: node scripts/check-i18n.cjs

      - name: Server-locale coverage guard
        run: node scripts/check-server-locales.cjs

      - name: Email + error i18n smoke
        run: node --experimental-strip-types --no-warnings scripts/smoke-i18n.ts

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate ephemeral model-signing secret
        shell: bash
        run: node -e "console.log('BMO_MODEL_HMAC_SECRET=' + require('node:crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"

      - name: Run unit + integration tests
        run: npm test
        env:
          NODE_ENV: test
          RESEARCH_DB_ENABLED: "false"
          ADMIN_API_KEY: ci-admin-key

  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate ephemeral model-signing secret
        shell: bash
        run: node -e "console.log('BMO_MODEL_HMAC_SECRET=' + require('node:crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"

      - name: Build SPA + bundle server
        run: npm run build
        env:
          NODE_ENV: production
          ADMIN_API_KEY: ci-admin-key

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL security baseline
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: typescript, javascript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:typescript"

  contract-smoke:
    name: API contract smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate ephemeral model-signing secret
        shell: bash
        run: node -e "console.log('BMO_MODEL_HMAC_SECRET=' + require('node:crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"

      - name: Build production bundle
        env:
          NODE_ENV: production
          RESEARCH_DB_ENABLED: "false"
          ADMIN_API_KEY: ci-admin-key
        run: npm run build

      - name: Run API contract smoke
        env:
          NODE_ENV: production
          RESEARCH_DB_ENABLED: "false"
          ADMIN_API_KEY: ci-admin-key
        run: npm run smoke -- --no-build
