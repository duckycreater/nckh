# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: nckh
    runtime: node
    branch: master
    # NODE_ENV=production makes npm omit devDependencies by default. The
    # explicit include keeps reproducible build/test tooling available during
    # Render's build phase; runtime still starts only dist/server.cjs.
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: BMO_MODEL_HMAC_SECRET
        generateValue: true
