# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: nckh
    runtime: node
    branch: master
    # NODE_ENV=production makes npm omit devDependencies by default. The
    # explicit include keeps reproducible build/test tooling available during
    # Render's build phase; runtime still starts only dist/server.cjs.
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # This repository has no hosted CI status checks. Waiting for checks would
    # leave production pinned to an old commit indefinitely; local test/build
    # gates run before each push instead.
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: BMO_MODEL_HMAC_SECRET
        generateValue: true
      # Must match Pi 5. Render deliberately prompts for this secret instead
      # of reading a credential committed to the repository.
      - key: BMO_ROBOT_SHARED_SECRET
        sync: false
